project:
  type: website
  output-dir: docs
  preview:
    watch-inputs: true
    navigate: true
    browser: true
  resources:
    - robots.txt

website:
  title: "Rokei Notes"
  site-url: "https://dreamian.github.io"
  site-path: "/"

  navbar:
    search: true
    left:
      - text: Home
        href: index.qmd
      - text: Study Notes
        menu:
          - text: Math
            href: study/math/index.qmd
          - text: Random Signal Theory
            href: study/random-signal-theory/index.qmd
          - text: Algorithms
            href: study/algorithm/index.qmd
          - text: Problem Solving
            href: study/problem-solving/index.qmd
          - text: Deep Learning
            href: study/deep-learning/index.qmd
          - text: Data Network
            href: study/data-network/index.qmd
      - text: Research Log
        menu:
          - text: Paper Reviews
            href: docs/research/papers/index.html
          - text: Experiment Logs
            href: research/logs/index.qmd

execute:
  freeze: auto
  python: C:\Users\dream\AppData\Local\Python\pythoncore-3.14-64\python.exe

format:
  html:
    theme: morpy
    toc: true
    code-copy: true
    code-fold: true